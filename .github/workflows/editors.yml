name: editors

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The two plugins are the only things in this repository a user installs rather than
# imports, and neither is built by `npm run check`: check runs the contract CONTRIBUTING.md
# states, and that contract does not ask a contributor for Java. So packaging lives here,
# beside it, and the artifacts it uploads are the ones a reviewer installs to try a change.
# ADR-0090.
jobs:
  vscode:
    runs-on: ubuntu-latest

    # The marketplace tokens reach only the steps that publish. Install, test and
    # packaging run the candidate's code and its dependencies' lifecycle scripts, and
    # none of them needs a token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
        working-directory: editors/vscode

      - run: npm test
        working-directory: editors/vscode

      # Packaging is the check: it bundles the extension host entry point, so a syntax
      # error or a missing require fails here rather than on somebody's first install.
      - run: npm run package
        working-directory: editors/vscode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: editors/vscode/*.vsix

      # A release tag publishes the packaged file, to each marketplace whose token the
      # repository holds. The tag must name the extension's version.
      - name: The tag names the extension's version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: editors/vscode
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # A step's `if` can't read a secret, so this step reports which tokens exist
      # without passing either one on.
      - name: Find the marketplace tokens
        id: tokens
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "vsce=${VSCE_PAT:+present}" >> "$GITHUB_OUTPUT"
          echo "ovsx=${OVSX_PAT:+present}" >> "$GITHUB_OUTPUT"

      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && steps.tokens.outputs.vsce == 'present'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath srl-*.vsix

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && steps.tokens.outputs.ovsx == 'present'
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 --pat "$OVSX_PAT" publish srl-*.vsix

  webstorm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # `package` compiles against the platform, runs the editor-session tests and lays out the
      # ZIP the marketplace and Install Plugin from Disk expect. The Plugin Verifier needs
      # an installed IDE, so it stays a local command; see editors/webstorm/pom.xml.
      - run: mvn -B package
        working-directory: editors/webstorm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webstorm-plugin
          path: editors/webstorm/target/*.zip

      # The Marketplace upload API adds a version to a plugin that already exists, so
      # the first version is uploaded by hand on plugins.jetbrains.com.
      - name: Find the marketplace token
        id: token
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: echo "jetbrains=${JETBRAINS_TOKEN:+present}" >> "$GITHUB_OUTPUT"

      - name: Publish to the JetBrains Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && steps.token.outputs.jetbrains == 'present'
        working-directory: editors/webstorm
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          curl --fail-with-body -sS \
            --header "Authorization: Bearer $JETBRAINS_TOKEN" \
            -F xmlId=dev.santella.srl \
            -F file=@"$(ls target/*.zip)" \
            -F channel=stable \
            https://plugins.jetbrains.com/api/updates/upload

  # Packaging proves the artifact; this proves installing it does anything. The two
  # editions are the minimum `engines.vscode` claims and current stable, which is where
  # the platform's API drift shows up. WebStorm needs a licensed IDE, so its adapter
  # stays a local command. ADR-0097.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The fixture is built from `npm pack` of both workspaces and links the rest of its
      # dependencies from here, so the repository has to be installed first.
      - run: npm ci

      # VS Code is an Electron application: it needs an X server. The libraries it links
      # against are already on the image, which ships two browsers.
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: xvfb-run -a npm run conformance -- --report conformance.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editor-conformance
          path: conformance.md
