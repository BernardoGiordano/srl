name: editors

on:
  push:
    branches: [main]
  pull_request:

# The two plugins are the only things in this repository a user installs rather than
# imports, and neither is built by `npm run check`: check runs the contract CONTRIBUTING.md
# states, and that contract does not ask a contributor for Java. So packaging lives here,
# beside it, and the artifacts it uploads are the ones a reviewer installs to try a change.
# ADR-0090.
jobs:
  vscode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci
        working-directory: editors/vscode

      - run: npm test
        working-directory: editors/vscode

      # Packaging is the check: it bundles the extension host entry point, so a syntax
      # error or a missing require fails here rather than on somebody's first install.
      - run: npm run package
        working-directory: editors/vscode

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix

  webstorm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # `package` compiles against the platform, runs the editor-session tests and lays out the
      # ZIP the marketplace and Install Plugin from Disk expect. The Plugin Verifier needs
      # an installed IDE, so it stays a local command; see editors/webstorm/pom.xml.
      - run: mvn -B package
        working-directory: editors/webstorm

      - uses: actions/upload-artifact@v4
        with:
          name: webstorm-plugin
          path: editors/webstorm/target/*.zip

  # Packaging proves the artifact; this proves installing it does anything. The two
  # editions are the minimum `engines.vscode` claims and current stable, which is where
  # the platform's API drift shows up. WebStorm needs a licensed IDE, so its adapter
  # stays a local command. ADR-0097.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The fixture is built from `npm pack` of both workspaces and links the rest of its
      # dependencies from here, so the repository has to be installed first.
      - run: npm ci

      # VS Code is an Electron application: it needs an X server. The libraries it links
      # against are already on the image, which ships two browsers.
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: xvfb-run -a npm run conformance -- --report conformance.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-conformance
          path: conformance.md
