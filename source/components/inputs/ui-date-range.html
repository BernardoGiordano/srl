<form
  data-ui-part="date-range"
  class="flex flex-col gap-2.5 rounded-md border border-ui-border bg-surface p-3 text-start {{ formClass }}"
  [aria-label]="text('title')"
  (submit)="onSubmit($event)"
  (keydown)="onKeydown($event)"
>
  <p data-ui-part="date-range-title" class="text-xs font-semibold text-muted">
    {{ text('title') }}
  </p>

  <div class="flex flex-wrap gap-2.5">
    <label class="flex min-w-32 flex-1 flex-col gap-1 text-xs">
      <span class="text-muted">{{ text('since') }}</span>
      <input
        type="date"
        data-ui-part="date-range-since"
        class="w-full rounded-md border border-ui-border bg-surface-raised px-2 py-1.5 text-sm text-ink outline-none focus-visible:ring-2 focus-visible:ring-accent"
        [.value]="since"
        [min]="minAttr"
        [max]="maxAttr"
        (input)="onSinceInput($event)"
      />
    </label>

    <label class="flex min-w-32 flex-1 flex-col gap-1 text-xs">
      <span class="text-muted">{{ text('until') }}</span>
      <input
        type="date"
        data-ui-part="date-range-until"
        class="w-full rounded-md border border-ui-border bg-surface-raised px-2 py-1.5 text-sm text-ink outline-none focus-visible:ring-2 focus-visible:ring-accent"
        [.value]="until"
        [min]="since"
        [max]="maxAttr"
        (input)="onUntilInput($event)"
      />
    </label>
  </div>

  <p *if="invalid" data-ui-part="date-range-error" role="alert" class="text-xs text-accent-strong">
    {{ text('invalid') }}
  </p>

  <div class="flex justify-end gap-2">
    <button
      type="button"
      data-ui-part="date-range-cancel"
      class="rounded-md border border-ui-border px-2.5 py-1 text-xs text-ink hover:bg-canvas"
      (click)="cancel()"
    >
      {{ text('cancel') }}
    </button>
    <button
      type="button"
      data-ui-part="date-range-confirm"
      class="rounded-md bg-brand px-2.5 py-1 text-xs text-brand-contrast hover:bg-brand-hover"
      (click)="confirm()"
    >
      {{ text('confirm') }}
    </button>
  </div>
</form>
