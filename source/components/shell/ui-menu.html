<button
  type="button"
  data-ui-part="menu-trigger"
  class="{{ triggerClass }}"
  aria-haspopup="true"
  aria-expanded="false"
  [aria-label]="labelAttr"
  (click)="toggle()"
>
  <x-content name="trigger"></x-content>
</button>

<div
  *if="open"
  data-ui-part="menu-panel"
  [role]="roleAttr"
  class="{{ panelClass }}"
>
  <x-content></x-content>
</div>
