<section
  class="overflow-hidden rounded-xl border border-ui-border bg-surface shadow-[0_1px_2px_var(--ui-color-shadow)]"
>
  <!--
    Keep the header mounted so projected content always has a stable marker.
  -->
  <header class="px-5 pt-4 {{ headerClasses }}">
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
      <ui-avatar *if="avatar" name="{{ avatar }}" fallback-class="{{ avatarClasses }}"></ui-avatar>

      <div class="min-w-0">
        <p *if="eyebrow" class="mb-0.5 text-[12px] font-medium text-muted">{{ eyebrow }}</p>
        <h2 *if="heading" class="text-[15px] font-semibold tracking-tight text-ink">{{ heading }}</h2>
      </div>

      <!-- Actions belong on the heading's line, pushed to the end. -->
      <div class="ms-auto flex items-center gap-2">
        <x-content name="actions"></x-content>
      </div>
    </div>

    <p *if="lead" class="mt-1 max-w-3xl text-[13px] leading-relaxed text-muted">{{ lead }}</p>

    <div class="mt-4 empty:hidden">
      <x-content name="toolbar"></x-content>
    </div>
  </header>

  <div class="{{ bodyClasses }} text-[13.5px] text-ink">
    <x-content></x-content>
  </div>
</section>
