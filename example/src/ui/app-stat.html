<div
  class="rounded-xl border border-ui-border bg-surface p-4 shadow-[0_1px_2px_var(--ui-color-shadow)]"
>
  <div class="flex items-center gap-2.5">
    <span
      *if="icon"
      class="flex size-7 shrink-0 items-center justify-center rounded-lg bg-brand/10 text-accent"
      aria-hidden="true"
    >
      <svg
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path [d]="iconData"></path>
      </svg>
    </span>
    <p class="min-w-0 flex-1 truncate text-[13px] font-medium text-muted" [title]="label">{{ label }}</p>

    <span
      *if="hasDelta"
      class="inline-flex shrink-0 items-center gap-1 rounded-full px-1.5 py-0.5 text-[11.5px] font-medium tabular-nums {{ deltaClasses }}"
      [title]="deltaLabel"
    >
      <svg
        class="size-3 {{ delta < 0 ? '-scale-y-100' : '' }}"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 17l6-6 4 4 8-8 M15 7h6v6"></path>
      </svg>
      {{ formattedDelta }}
    </span>
  </div>

  <p
    class="mt-4 truncate text-[26px] font-semibold leading-none tracking-tight tabular-nums text-ink"
  >
    {{ formattedValue }}
  </p>

  <p *if="hint" class="mt-2 text-[12px] text-muted">{{ hint }}</p>
</div>
