<div
  class="rounded-xl border border-ui-border bg-surface px-5 py-4 shadow-[0_1px_3px_var(--ui-color-shadow)]"
>
  <p class="text-[12px] font-semibold uppercase tracking-wide text-muted">{{ label }}</p>

  <p class="mt-2 flex flex-wrap items-baseline gap-2">
    <span class="text-[26px] font-bold leading-none tracking-tight text-ink">
      {{ formattedValue }}
    </span>
    <span
      *if="hasDelta"
      class="text-[13px] font-semibold {{ deltaClasses }}"
      [title]="deltaLabel"
    >
      {{ formattedDelta }}
    </span>
  </p>

  <p *if="hint" class="mt-1.5 text-[12px] text-muted">{{ hint }}</p>
</div>
