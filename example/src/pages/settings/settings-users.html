<div class="space-y-3">
  <p class="text-[13px] leading-relaxed text-muted">{{ t('settings.usersLead') }}</p>

  <app-notice
    *if="!canWrite"
    variant="empty"
    message="{{ t('settings.readOnlyNotice') }}"
  ></app-notice>

  <app-notice
    *if="errorMessage"
    variant="error"
    message="{{ errorMessage }}"
  ></app-notice>

  <app-notice
    *if="failed"
    variant="error"
    message="{{ t('common.loadFailed') }}"
    action="{{ t('common.retry') }}"
    (action)="load()"
  ></app-notice>

  <div
    *if="selectionCount > 0"
    class="flex flex-wrap items-center gap-2 rounded-md border border-ui-border bg-canvas px-3 py-2 text-[13px]"
  >
    <span class="me-auto font-semibold text-ink" aria-live="polite">
      {{ t('settings.bulkSelected', { count: selectionCount }) }}
    </span>
    <button
      type="button"
      class="cursor-pointer rounded-md border border-ui-border px-2.5 py-1 font-semibold transition-colors hover:bg-surface disabled:cursor-not-allowed disabled:opacity-50"
      [?disabled]="busy"
      (click)="applyToSelection('suspended')"
    >
      {{ t('settings.bulkSuspend') }}
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-md border border-ui-border px-2.5 py-1 font-semibold transition-colors hover:bg-surface disabled:cursor-not-allowed disabled:opacity-50"
      [?disabled]="busy"
      (click)="applyToSelection('active')"
    >
      {{ t('settings.bulkActivate') }}
    </button>
    <button
      type="button"
      class="cursor-pointer rounded-md px-2.5 py-1 text-muted transition-colors hover:text-ink"
      (click)="clearSelection()"
    >
      {{ t('settings.bulkClear') }}
    </button>
  </div>

  <ui-table
    pagination="client"
    page-size="10"
    page-sizes="10,25"
    selectable
    [.rows]="rows"
    [.loading]="loading"
    [.row-key]="rowKey"
    [.selected-keys]="selectedKeys"
    [.row-selectable]="rowSelectable"
    (selection-change)="captureSelection($event)"
    caption="{{ t('nav.settingsUsers') }}"
    empty-label="{{ t('settings.usersEmpty') }}"
  >
    <ui-table-column key="name" label="{{ t('settings.name') }}" sortable width="200"></ui-table-column>
    <ui-table-column key="email" label="{{ t('settings.email') }}" sortable width="240"></ui-table-column>
    <ui-table-column
      key="role"
      label="{{ t('settings.role') }}"
      sortable
      width="150"
      [.renderer]="renderRole"
    ></ui-table-column>
    <ui-table-column
      key="status"
      label="{{ t('settings.status') }}"
      sortable
      width="130"
      [.renderer]="renderStatus"
      [.filter-value]="filterStatus"
    ></ui-table-column>
    <ui-table-column
      key="lastSeen"
      label="{{ t('settings.lastSeen') }}"
      sortable
      width="150"
      sort-start="desc"
      [.renderer]="renderLastSeen"
    ></ui-table-column>
    <!-- No `key`: the cell is a control, so there is no field behind it to sort. -->
    <ui-table-column
      key="action"
      label="{{ t('settings.action') }}"
      locked
      width="130"
      header-class="text-end"
      cell-class="text-end"
      [.renderer]="renderAction"
    ></ui-table-column>
  </ui-table>
</div>
