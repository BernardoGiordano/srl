<div>
  <p class="flex items-center gap-2 text-[12px] text-muted">
    <span
      class="size-2 shrink-0 rounded-full {{ connected ? 'bg-emerald-500' : 'animate-pulse bg-amber-500' }}"
      aria-hidden="true"
    ></span>
    <span aria-live="polite">{{ statusText }}</span>
  </p>

  <p *if="movements.length === 0" class="mt-3 text-[13px] text-muted">{{ t('live.waiting') }}</p>

  <ul *else class="mt-2 divide-y divide-ui-border">
    <li *for="movement of movements; key: movement.id" class="flex items-center gap-3 py-2">
      <app-badge [tone]="tone(movement)">{{ kindLabel(movement) }}</app-badge>

      <span class="min-w-0 flex-1">
        <span class="block truncate text-[13px] font-medium text-ink">{{ movement.name }}</span>
        <span class="block text-[11.5px] text-muted">
          {{ movement.sku }} · {{ movement.warehouse }} · {{ when(movement) }}
        </span>
      </span>

      <span class="shrink-0 text-end">
        <span class="block font-semibold tabular-nums text-ink">{{ quantity(movement) }}</span>
        <span class="block text-[11.5px] text-muted">{{ t('live.onHand', { count: movement.stock }) }}</span>
      </span>
    </li>
  </ul>
</div>
