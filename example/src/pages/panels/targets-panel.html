<div>
  <app-notice
    *if="failed"
    variant="error"
    message="{{ t('common.loadFailed') }}"
    action="{{ t('common.retry') }}"
    (action)="load()"
  ></app-notice>

  <p class="text-[13px] text-muted">{{ t('dashboard.targetTitle') }}</p>

  <p class="mt-1 flex items-baseline gap-2">
    <span class="text-[28px] font-bold leading-none tracking-tight text-ink">{{ percent }}</span>
    <span class="text-[13px] text-muted">{{ t('dashboard.ofTarget') }}</span>
  </p>

  <progress
    class="mt-3 h-2.5 w-full overflow-hidden rounded-full [&::-webkit-progress-bar]:bg-canvas [&::-webkit-progress-value]:bg-accent [&::-moz-progress-bar]:bg-accent"
    max="1"
    [.value]="attained"
    [aria-label]="caption"
  ></progress>

  <p class="mt-2 text-[12.5px] text-muted">{{ caption }}</p>
</div>
