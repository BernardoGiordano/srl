<div class="space-y-5 p-4 sm:p-6">
  <app-notice *if="pending" variant="loading" message="{{ t('common.loading') }}"></app-notice>

  <app-notice
    *if="failed"
    variant="error"
    message="{{ t('common.loadFailed') }}"
    action="{{ t('common.retry') }}"
    (action)="load()"
  ></app-notice>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    <app-card
      *for="warehouse of rows; key: warehouse.id"
      eyebrow="{{ warehouse.id }}"
      heading="{{ warehouse.name }}"
    >
      <app-badge slot="actions" [tone]="alertTone(warehouse)">{{ alertsLabel(warehouse) }}</app-badge>

      <p class="text-[13px] text-muted">{{ warehouse.city }}, {{ warehouse.country }}</p>

      <p class="mt-3 flex items-baseline justify-between gap-2">
        <span class="text-[20px] font-bold leading-none text-ink">{{ utilisationLabel(warehouse) }}</span>
        <span class="text-[12px] text-muted">{{ skusLabel(warehouse) }}</span>
      </p>

      <meter
        class="mt-2 block h-2.5 w-full"
        min="0"
        max="1"
        low="0.7"
        high="0.9"
        optimum="0.5"
        [.value]="utilisation(warehouse)"
        [aria-label]="capacityLabel(warehouse)"
      ></meter>

      <p class="mt-2 text-[12px] tabular-nums text-muted">{{ capacityLabel(warehouse) }}</p>
    </app-card>
  </div>
</div>
