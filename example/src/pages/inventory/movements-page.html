<div class="p-4 sm:p-6">
  <app-card
    flush
    eyebrow="{{ t('nav.inventory') }}"
    heading="{{ t('nav.inventoryMovements') }}"
    lead="{{ t('movements.lead') }}"
  >
    <span slot="actions" class="flex items-center gap-2 text-[12.5px] text-muted">
      <span
        class="size-2 shrink-0 rounded-full {{ connected ? 'bg-emerald-500' : 'animate-pulse bg-amber-500' }}"
        aria-hidden="true"
      ></span>
      <span aria-live="polite">{{ streamLabel }}</span>
    </span>

    <app-notice
      *if="failed"
      variant="error"
      message="{{ t('common.loadFailed') }}"
      action="{{ t('common.retry') }}"
      (action)="load()"
    ></app-notice>

    <!--
      The reconciliation aid the selection exists for: a net quantity over the
      chosen rows, which is the one arithmetic a stock log is read for and the
      one a windowed table must still get right when most rows are not in the
      DOM. The count is announced, because ticking a checkbox changes a number
      several rows away.
    -->
    <p
      *if="selectionCount > 0"
      class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-ui-border bg-canvas px-3 py-2 text-[13px]"
      aria-live="polite"
    >
      <span class="font-semibold text-ink">{{ t('movements.selected', { count: selectionCount }) }}</span>
      <span class="tabular-nums text-muted">{{ t('movements.selectedNet', { net: selectedNet }) }}</span>
      <button
        type="button"
        class="ms-auto cursor-pointer rounded-md px-2.5 py-1 text-muted transition-colors hover:text-ink"
        (click)="clearSelection()"
      >
        {{ t('movements.clearSelection') }}
      </button>
    </p>

    <!--
      A window rather than pages. The list grows from the top while the user
      watches it, and a page number that means a different row every few seconds
      is worse than no page number: the rows a window holds are the rows the
      scroll position asks for, so an arriving movement moves the list rather
      than the reader. ADR-0107, ADR-0116.
    -->
    <ui-table
      state-id="inventory-movements"
      pagination="none"
      virtualized
      viewport-height="480"
      selectable
      column-chooser
      [.rows]="rows"
      [.loading]="loading"
      [.row-key]="rowKey"
      [.selected-keys]="selectedKeys"
      (selection-change)="captureSelection($event)"
      caption="{{ t('nav.inventoryMovements') }}"
      empty-label="{{ t('movements.empty') }}"
    >
      <ui-table-column
        key="kind"
        label="{{ t('movements.kindLabel') }}"
        sortable
        width="130"
        [.renderer]="renderKind"
        [.filter-value]="filterKind"
      ></ui-table-column>
      <ui-table-column key="sku" label="{{ t('products.sku') }}" sortable hideable width="130"></ui-table-column>
      <ui-table-column key="warehouse" label="{{ t('products.warehouse') }}" sortable hideable width="130"></ui-table-column>
      <ui-table-column
        key="quantity"
        label="{{ t('movements.quantity') }}"
        sortable
        hideable
        width="120"
        header-class="text-end"
        cell-class="text-end tabular-nums"
        [.renderer]="renderQuantity"
      ></ui-table-column>
      <ui-table-column
        key="at"
        label="{{ t('movements.at') }}"
        sortable
        hideable
        width="180"
        sort-start="desc"
        [.renderer]="renderAt"
      ></ui-table-column>
      <ui-table-column
        key="ago"
        label="{{ t('movements.ago') }}"
        hideable
        width="140"
        sort-key="at"
        [.renderer]="renderAgo"
      ></ui-table-column>
      <ui-table-column key="actor" label="{{ t('movements.actor') }}" sortable hideable width="150"></ui-table-column>
    </ui-table>
  </app-card>
</div>
