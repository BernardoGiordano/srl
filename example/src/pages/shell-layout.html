<!--
  The shared components provide the sidebar and header. Tailwind classes read
  semantic tokens, and the outlet holds each child screen.
-->
<ui-app-shell
  class="group/shell flex min-h-screen bg-sidebar"
  backdrop-class="fixed inset-0 z-20 bg-overlay backdrop-blur-[2px] lg:hidden"
>
<!-- Sidebar -->
  <!--
    Below `lg`, the sidebar slides out in the document's reading direction.
    From `lg` up, it stays in the page. Scope both RTL transforms to the small
    layout so they cannot shift the desktop sidebar.
  -->
  <ui-sidebar
    slot="sidebar"
    storage-key="example.sidebar"
    class="group/sidebar z-30 flex w-[244px] shrink-0 flex-col bg-sidebar text-sidebar-text transition-[transform,width] duration-200 ease-out max-lg:fixed max-lg:inset-y-0 max-lg:start-0 max-lg:-translate-x-full max-lg:shadow-[0_24px_64px_var(--ui-color-shadow)] max-lg:rtl:translate-x-full max-lg:group-data-drawer-open/shell:translate-x-0 lg:sticky lg:top-0 lg:h-screen lg:data-collapsed:w-[64px]"
  >
    <div
      class="relative flex h-14 shrink-0 items-center gap-2.5 px-4 group-data-collapsed/sidebar:justify-center group-data-collapsed/sidebar:px-0"
    >
      <span
        class="flex size-7 shrink-0 items-center justify-center rounded-lg bg-brand bg-[linear-gradient(135deg,rgb(255_255_255/28%),transparent_65%)] text-brand-contrast shadow-[0_1px_2px_var(--ui-color-shadow),inset_0_0_0_1px_rgb(255_255_255/12%)]"
        aria-hidden="true"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linejoin="round"
        >
          <path [d]="iconPath('bolt')"></path>
        </svg>
      </span>

      <span
        class="min-w-0 flex-1 truncate text-[14.5px] font-semibold tracking-tight group-data-collapsed/sidebar:hidden"
      >
        {{ t('app.name') }}
      </span>

      <!--
        Keep the toggle's hover background opaque across the sidebar edge. Mirror
        its chevron for RTL before the collapsed rotation applies.
      -->
      <ui-sidebar-toggle
        label="{{ t('a11y.toggleSidebar') }}"
        button-class="absolute -end-3 top-1/2 hidden size-6 -translate-y-1/2 items-center justify-center rounded-full border border-ui-border bg-surface text-muted shadow-[0_1px_3px_var(--ui-color-shadow)] transition-colors hover:text-ink lg:flex"
      >
        <svg
          class="size-3.5 transition-transform duration-200 rtl:-scale-x-100 group-data-collapsed/sidebar:rotate-180"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [d]="iconPath('chevronLeft')"></path>
        </svg>
      </ui-sidebar-toggle>
    </div>

    <nav class="flex-1 space-y-0.5 overflow-y-auto overflow-x-hidden px-2.5 pb-6 pt-2">
      <!--
        Match `/` exactly so the dashboard does not highlight on other routes.
      -->
      <ui-sidebar-item
        class="group/item block"
        href="/"
        exact
        link-class="flex h-8 items-center gap-2.5 rounded-lg px-2.5 text-[13.5px] text-sidebar-muted transition-colors hover:bg-sidebar-hover hover:text-sidebar-text group-data-collapsed/sidebar:justify-center group-data-collapsed/sidebar:px-0"
        active-class="bg-sidebar-active font-medium text-sidebar-text shadow-[0_1px_2px_var(--ui-color-shadow),0_0_0_1px_var(--ui-color-border)]"
      >
        <svg
          class="size-[17px] shrink-0 group-data-active/item:text-accent"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [d]="iconPath('dashboard')"></path>
        </svg>
        <span class="min-w-0 flex-1 truncate group-data-collapsed/sidebar:hidden">
          {{ t('nav.dashboard') }}
        </span>
      </ui-sidebar-item>

      <p
        class="px-2.5 pb-1 pt-5 text-[11.5px] font-medium text-sidebar-muted/80 group-data-collapsed/sidebar:hidden"
      >
        {{ t('nav.workspace') }}
      </p>

      <ui-sidebar-group
        *for="section of sections; key: section.key"
        class="group/section block"
        [match]="section.path"
        trigger-class="flex h-8 w-full cursor-pointer items-center gap-2.5 rounded-lg px-2.5 text-start text-[13.5px] text-sidebar-muted transition-colors hover:bg-sidebar-hover hover:text-sidebar-text group-data-collapsed/sidebar:justify-center group-data-collapsed/sidebar:px-0"
        panel-class="relative mb-1 ms-[19px] mt-0.5 space-y-0.5 border-s border-ui-border ps-2 group-data-collapsed/sidebar:hidden"
      >
        <span slot="trigger" class="flex w-full items-center gap-2.5 group-data-collapsed/sidebar:justify-center">
          <svg
            class="size-[17px] shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [d]="iconPath(section.icon)"></path>
          </svg>

          <span class="min-w-0 flex-1 truncate text-start group-data-collapsed/sidebar:hidden">
            {{ t('nav.' + section.key) }}
          </span>

          <svg
            class="size-3.5 shrink-0 opacity-60 transition-transform duration-200 group-data-open/section:rotate-180 group-data-collapsed/sidebar:hidden"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [d]="iconPath('chevronDown')"></path>
          </svg>
        </span>

<!-- The wrapper spaces the rows. -->
        <div class="space-y-0.5">
          <ui-sidebar-item
            *for="leaf of section.children; key: leaf.key"
            class="block"
            [href]="leaf.path"
            link-class="flex h-7 items-center truncate rounded-md px-2.5 text-[13px] text-sidebar-muted transition-colors hover:bg-sidebar-hover hover:text-sidebar-text"
            active-class="bg-sidebar-active font-medium text-sidebar-text shadow-[0_1px_2px_var(--ui-color-shadow),0_0_0_1px_var(--ui-color-border)]"
            >{{ t('nav.' + leaf.key) }}</ui-sidebar-item
          >
        </div>
      </ui-sidebar-group>
    </nav>

<!-- Show live stream status. -->
    <div class="shrink-0 p-2.5">
      <div
        class="flex items-center gap-2.5 rounded-lg border border-ui-border bg-surface px-3 py-2 text-[12px] text-muted shadow-[0_1px_2px_var(--ui-color-shadow)] group-data-collapsed/sidebar:justify-center group-data-collapsed/sidebar:border-transparent group-data-collapsed/sidebar:bg-transparent group-data-collapsed/sidebar:px-0 group-data-collapsed/sidebar:shadow-none"
      >
        <span class="relative flex size-2 shrink-0" aria-hidden="true">
          <span
            *if="live"
            class="absolute inset-0 animate-ping rounded-full bg-emerald-400 opacity-60 motion-reduce:hidden"
          ></span>
          <span class="relative size-2 rounded-full {{ live ? 'bg-emerald-500' : 'animate-pulse bg-amber-500' }}"></span>
        </span>
        <span class="truncate group-data-collapsed/sidebar:hidden">
          {{ live ? t('live.connected', { count: liveCount }) : t('live.reconnecting') }}
        </span>
      </div>
    </div>
  </ui-sidebar>

<!-- Main column -->
  <!--
    From `lg` up, the screen sits on a raised panel inset from the sidebar.
    The panel does not clip, so menus and comboboxes can overflow it.
  -->
  <div class="flex min-w-0 flex-1 flex-col lg:py-2 lg:pe-2">
    <div
      class="flex min-h-full flex-1 flex-col bg-canvas lg:rounded-xl lg:border lg:border-ui-border lg:shadow-[0_1px_3px_var(--ui-color-shadow)]"
    >
      <!--
        Let the top bar scroll with the page while the sidebar stays in place.
      -->
      <ui-topbar
        class="flex h-14 shrink-0 items-center gap-2 border-b border-ui-border bg-surface px-4 sm:px-6 lg:rounded-t-[11px]"
      >
        <ui-sidebar-toggle
          for="drawer"
          label="{{ t('a11y.openMenu') }}"
          button-class="-ms-1.5 flex size-8 items-center justify-center rounded-lg text-muted transition-colors hover:bg-canvas hover:text-ink lg:hidden"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path [d]="iconPath('menu')"></path>
          </svg>
        </ui-sidebar-toggle>

        <h1 class="sr-only">{{ pageTitle }}</h1>

        <ui-breadcrumb
          class="min-w-0"
          [.items]="breadcrumbs"
          label="{{ t('a11y.breadcrumb') }}"
          separator="/"
          list-class="flex min-w-0 items-center gap-1.5 text-[13.5px]"
          item-class="flex min-w-0 items-center gap-1.5 [&:not(:last-child)]:max-sm:hidden"
          link-class="truncate rounded-md text-muted transition-colors hover:text-ink"
          current-class="truncate"
          separator-class="text-muted/50"
        ></ui-breadcrumb>

        <div class="ms-auto flex shrink-0 items-center gap-1.5">
          <!--
            `setLocale` updates translated text without a page reload. Below `sm`
            each picker shows its icon, and the transparent select covers it.
          -->
          <label
            class="relative flex h-8 items-center gap-1.5 rounded-lg px-2 text-muted transition-colors focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent hover:bg-canvas hover:text-ink sm:pe-0"
            title="{{ t('app.language') }}"
          >
            <svg
              class="size-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [d]="iconPath('globe')"></path>
            </svg>
            <span class="sr-only">{{ t('app.language') }}</span>
            <select
              class="h-full cursor-pointer appearance-none bg-transparent pe-6 text-[12.5px] font-medium text-ink outline-none max-sm:absolute max-sm:inset-0 max-sm:opacity-0"
              [aria-label]="t('app.language')"
              (change)="selectLocale($event)"
            >
              <option
                *for="option of locales; key: option.code"
                [value]="option.code"
                [.selected]="option.code === localeCode"
              >
                {{ option.label }}
              </option>
            </select>
            <svg
              class="pointer-events-none absolute end-1.5 size-3 max-sm:hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [d]="iconPath('chevronDown')"></path>
            </svg>
          </label>

          <label
            class="relative flex h-8 items-center gap-1.5 rounded-lg px-2 text-muted transition-colors focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent hover:bg-canvas hover:text-ink sm:pe-0"
            title="{{ t('theme.label') }}"
          >
            <svg
              class="size-4 shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [d]="iconPath('palette')"></path>
            </svg>
            <span class="sr-only">{{ t('theme.label') }}</span>
            <!--
              Mark the option rather than setting the select's value, because the
              value would be set before the options exist.
            -->
            <select
              class="h-full cursor-pointer appearance-none bg-transparent pe-6 text-[12.5px] font-medium text-ink outline-none max-sm:absolute max-sm:inset-0 max-sm:opacity-0"
              [aria-label]="t('a11y.theme')"
              (change)="selectTheme($event)"
            >
              <option
                *for="option of themes; key: option.name"
                [value]="option.name"
                [.selected]="option.name === themeName"
              >
                {{ option.label }}
              </option>
            </select>
            <svg
              class="pointer-events-none absolute end-1.5 size-3 max-sm:hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [d]="iconPath('chevronDown')"></path>
            </svg>
          </label>

          <span class="mx-1.5 h-5 w-px bg-ui-border" aria-hidden="true"></span>

          <ui-menu
            class="relative"
            label="{{ t('a11y.userMenu') }}"
            trigger-class="block cursor-pointer rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
            panel-class="absolute end-0 z-40 mt-2 w-64 overflow-hidden rounded-xl border border-ui-border bg-surface-raised p-1 text-[13px] text-ink shadow-[0_12px_32px_var(--ui-color-shadow)]"
          >
            <span slot="trigger" class="block">
              <ui-avatar
                name="{{ userName }}"
                fallback-class="flex size-8 items-center justify-center rounded-full text-[12px] font-semibold ring-2 ring-surface {{ avatarTone(userName) }}"
              ></ui-avatar>
            </span>

            <div>
              <div class="mb-1 flex items-center gap-3 border-b border-ui-border px-3 pb-3 pt-2">
                <ui-avatar
                  name="{{ userName }}"
                  fallback-class="flex size-9 shrink-0 items-center justify-center rounded-full text-[13px] font-semibold {{ avatarTone(userName) }}"
                ></ui-avatar>
                <p class="min-w-0">
                  <span class="block truncate font-semibold">{{ userName }}</span>
                  <span class="block truncate text-[12px] text-muted">{{ t(roleKey) }}</span>
                </p>
              </div>
              <a
                href="/settings/profile"
                class="flex items-center gap-2.5 rounded-lg px-3 py-2 transition-colors hover:bg-canvas"
              >
                <svg
                  class="size-4 text-muted"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path [d]="iconPath('user')"></path>
                </svg>
                {{ t('nav.settingsProfile') }}
              </a>
              <button
                type="button"
                class="flex w-full cursor-pointer items-center gap-2.5 rounded-lg px-3 py-2 text-start transition-colors hover:bg-canvas"
                (click)="signOut()"
              >
                <svg
                  class="size-4 text-muted"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path [d]="iconPath('logout')"></path>
                </svg>
                {{ t('user.signOut') }}
              </button>
            </div>
          </ui-menu>
        </div>
      </ui-topbar>

      <!--
        Give the child outlet a box that can grow with the page.
      -->
      <x-route-outlet class="block min-w-0 flex-1"></x-route-outlet>
    </div>
  </div>
</ui-app-shell>
