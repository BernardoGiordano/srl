<div class="grid min-h-screen bg-surface lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]">
  <div class="flex min-w-0 flex-col px-6 py-6 sm:px-10">
    <div class="flex items-center justify-between gap-3">
      <!--
        Name the application and its library together.
      -->
      <div class="flex min-w-0 items-center gap-2.5">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-brand bg-[linear-gradient(135deg,rgb(255_255_255/28%),transparent_65%)] text-brand-contrast shadow-[0_1px_2px_var(--ui-color-shadow)]"
          aria-hidden="true"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M13 3L6 13h5l-1 8 8-11h-5z"></path>
          </svg>
        </span>
        <p class="truncate text-[16px] font-semibold tracking-tight text-ink">{{ t('app.name') }}</p>
      </div>

      <!-- Available before sign-in, because a login form nobody can read is a wall. -->
      <label class="shrink-0 text-[12px] text-muted">
        <span class="sr-only">{{ t('app.language') }}</span>
        <select
          class="cursor-pointer rounded-lg border border-ui-border bg-surface px-2.5 py-1.5 text-[12.5px] font-medium text-ink shadow-[0_1px_2px_var(--ui-color-shadow)] outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          [aria-label]="t('app.language')"
          (change)="selectLocale($event)"
        >
          <option
            *for="option of locales; key: option.code"
            [value]="option.code"
            [.selected]="option.code === localeCode"
          >
            {{ option.label }}
          </option>
        </select>
      </label>
    </div>

    <div class="flex flex-1 items-center justify-center py-10">
      <form class="w-full max-w-sm space-y-5" (submit)="submit($event)">
        <div>
          <h1 class="text-[24px] font-semibold tracking-tight text-ink">{{ t('login.title') }}</h1>
          <p class="mt-1.5 text-[13.5px] leading-relaxed text-muted">{{ t('login.lead') }}</p>
        </div>

        <label class="block">
          <span class="text-[13px] font-medium text-ink">{{ t('login.username') }}</span>
          <input
            name="username"
            required
            autocomplete="username"
            value="ada"
            class="mt-1.5 w-full rounded-lg border border-ui-border bg-surface-raised px-3 py-2.5 text-[14px] text-ink shadow-[0_1px_2px_var(--ui-color-shadow)] outline-none focus:border-accent focus:outline-2 focus:outline-offset-1 focus:outline-accent"
          />
        </label>

        <!--
          Leave the demo role password empty so the visitor chooses a role.
        -->
        <label class="block">
          <span class="text-[13px] font-medium text-ink">{{ t('login.password') }}</span>
          <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="{{ t('login.passwordHint') }}"
            class="mt-1.5 w-full rounded-lg border border-ui-border bg-surface-raised px-3 py-2.5 text-[14px] text-ink shadow-[0_1px_2px_var(--ui-color-shadow)] outline-none placeholder:text-muted focus:border-accent focus:outline-2 focus:outline-offset-1 focus:outline-accent"
          />
        </label>

        <p *if="errorMessage" class="text-[13px] font-medium text-rose-700 dark:text-rose-300" role="alert">
          {{ errorMessage }}
        </p>

        <button
          type="submit"
          [?disabled]="busy"
          class="w-full cursor-pointer rounded-lg bg-brand px-3 py-2.5 text-[14px] font-medium text-brand-contrast shadow-[0_1px_2px_var(--ui-color-shadow),inset_0_1px_0_rgb(255_255_255/14%)] transition-colors hover:bg-brand-hover disabled:cursor-default disabled:opacity-50"
        >
          {{ busy ? t('login.submitting') : t('login.submit') }}
        </button>

        <div class="rounded-xl border border-ui-border bg-canvas px-4 py-3 text-[12.5px] text-muted">
          <p class="font-medium text-ink">{{ t('login.rolesTitle') }}</p>
          <ul class="mt-2 space-y-1.5">
            <li class="flex gap-2">
              <code class="h-fit shrink-0 rounded-md bg-surface px-1.5 py-0.5 font-mono text-[11.5px] font-medium text-ink ring-1 ring-inset ring-ui-border">admin</code>
              <span>{{ t('login.roleAdmin') }}</span>
            </li>
            <li class="flex gap-2">
              <code class="h-fit shrink-0 rounded-md bg-surface px-1.5 py-0.5 font-mono text-[11.5px] font-medium text-ink ring-1 ring-inset ring-ui-border">operator</code>
              <span>{{ t('login.roleOperator') }}</span>
            </li>
            <li class="flex gap-2">
              <code class="h-fit shrink-0 rounded-md bg-surface px-1.5 py-0.5 font-mono text-[11.5px] font-medium text-ink ring-1 ring-inset ring-ui-border">viewer</code>
              <span>{{ t('login.roleViewer') }}</span>
            </li>
          </ul>
        </div>
      </form>
    </div>

    <p class="text-[12px] text-muted">{{ t('app.tagline') }}</p>
  </div>

  <!--
    Decoration only. The panel sketches the product behind the form.
  -->
  <div
    class="relative m-3 hidden overflow-hidden rounded-2xl bg-brand lg:block"
    aria-hidden="true"
  >
    <div
      class="absolute inset-0 bg-[radial-gradient(120%_80%_at_100%_0%,rgb(255_255_255/22%),transparent_55%),radial-gradient(90%_70%_at_0%_100%,rgb(0_0_0/28%),transparent_60%)]"
    ></div>
    <div
      class="absolute inset-0 bg-[linear-gradient(rgb(255_255_255/6%)_1px,transparent_1px),linear-gradient(90deg,rgb(255_255_255/6%)_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(ellipse_at_center,black,transparent_75%)]"
    ></div>

    <div class="absolute inset-x-12 top-1/2 -translate-y-1/2 space-y-4">
      <div class="grid grid-cols-3 gap-4">
        <div
          *for="bar of [62, 84, 45]; key: bar"
          class="rounded-xl border border-white/20 bg-white/10 p-4 backdrop-blur-sm"
        >
          <div class="h-2 w-16 rounded-full bg-white/40"></div>
          <div class="mt-4 h-5 w-24 rounded-md bg-white/80"></div>
          <div class="mt-3 h-1.5 w-full rounded-full bg-white/15">
            <div class="h-full rounded-full bg-white/70 {{ bar > 80 ? 'w-5/6' : bar > 60 ? 'w-3/5' : 'w-2/5' }}"></div>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-white/20 bg-white/10 p-2 backdrop-blur-sm">
        <div
          *for="row of [1, 2, 3, 4, 5]; key: row"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 {{ row === 2 ? 'bg-white/15' : '' }}"
        >
          <div class="size-7 shrink-0 rounded-md bg-white/30"></div>
          <div class="min-w-0 flex-1 space-y-1.5">
            <div class="h-2 rounded-full bg-white/70 {{ row % 2 === 0 ? 'w-32' : 'w-40' }}"></div>
            <div class="h-1.5 w-24 rounded-full bg-white/30"></div>
          </div>
          <div class="h-5 w-16 rounded-md bg-white/20"></div>
          <div class="h-2 w-14 rounded-full bg-white/40"></div>
        </div>
      </div>
    </div>
  </div>
</div>
