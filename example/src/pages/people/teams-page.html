<div class="space-y-5 p-4 sm:p-6">
  <app-notice *if="pending" variant="loading" message="{{ t('common.loading') }}"></app-notice>

  <app-notice
    *if="failed"
    variant="error"
    message="{{ t('common.loadFailed') }}"
    action="{{ t('common.retry') }}"
    (action)="load()"
  ></app-notice>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    <app-card *for="team of teams; key: team.id" eyebrow="{{ team.id }}" heading="{{ team.name }}">
      <span slot="actions" class="text-[12.5px] font-semibold tabular-nums text-muted">
        {{ share(team) }}
      </span>

      <p class="text-[13px] text-muted">{{ headcount(team) }}</p>

      <div class="mt-3 flex items-center gap-2.5">
        <ui-avatar
          name="{{ team.lead }}"
          fallback-class="flex size-8 items-center justify-center rounded-full bg-brand text-[11px] font-semibold text-brand-contrast"
        ></ui-avatar>
        <span class="min-w-0">
          <span class="block truncate text-[13px] font-medium text-ink">{{ team.lead }}</span>
          <span class="block text-[11.5px] text-muted">{{ t('people.teamLead') }}</span>
        </span>
      </div>
    </app-card>
  </div>
</div>
