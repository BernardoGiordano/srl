<!doctype html>
<html lang="en" dir="ltr" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Meridian is the example application built with srl. -->
    <title>Meridian — a CRM example app built with srl</title>

    <!--
      The component styles read tokens from the default palette. An application can
      replace the palette while keeping the shared styles.
    -->
    <link rel="stylesheet" href="/components/style.css" />
    <link rel="stylesheet" href="/components/theme-default.css" />
    <!-- Meridian's palette. The release build imports it from src/app.css. -->
    <link rel="stylesheet" href="/src/brand.css" data-artifact="source-only" />

    <!--
      The import map must precede module scripts. `npm run importmap` generates the
      library entries; this application adds its remote hashes. Application modules
      use relative paths because `@app/` cannot name more than one application.
      The browser checks each listed module against its integrity hash, and the
      runtime checks each remote template and locale bundle the same way. Two local
      controls must load before a deliberately mismatched local probe can prove pins.
    -->
    <script type="importmap">
      {
        "imports": {
          "lit": "/lib/vendor/lit-all.min.js",
          "lit/async-directive.js": "/lib/vendor/lit-all.min.js",
          "lit/directives/repeat.js": "/lib/vendor/lit-all.min.js",

          "@preact/signals-core": "/lib/vendor/signals-core.mjs",

          "@srljs/core": "/lib/srl-core.js",
          "@core/": "/lib/core/",
          "@auth/": "/lib/auth/",
          "@host/": "/lib/host/",
          "@components/": "/components/",
          "@core/foundation/pin-probe.js": "data:text/javascript,export%20const%20probe%20%3D%20true%3B#srl-pin-probe"
        },
        "integrity": {
          "/lib/vendor/lit-all.min.js": "sha384-qSoE0anPDAzsBuoT95C270Wd5oKtOOlLdEvSXEk9bRYTg+5ygjyt20ZuhzH0oNbt",
          "/lib/vendor/signals-core.mjs": "sha384-keryyWsAJJ2UD+2G3I6cCzzXkFvp97AwDUCMKAOYrVGK2iwcrnTYMpWMrq9xkPSm",
          "data:text/javascript,export%20const%20probe%20%3D%20true%3B#srl-pin-control": "sha384-THhiqtbWX5OeF4HVBm/Zv1KwP1F/7VKSRBsO2utL7lYi95x/jfLVpbG0o0up8PT5",
          "data:text/javascript,#srl-pin-empty": "sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb",
          "data:text/javascript,export%20const%20probe%20%3D%20true%3B#srl-pin-probe": "sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb",
          "/remotes/billing/remote-entry.js": "sha384-XLq/ucrJO4xd00F/oUEHSak2OJTqag8j2aX7+fgs3Ez73mPayACfLGLiHXqFW6yC",
          "/remotes/billing/billing-root.js": "sha384-cQDXGlibrC8pkgbuyRE7n2k4BSB+nUQMC5RExs5/e2eADBqH4zBJhzZomssao4vZ",

          "/remotes/analytics/remote-entry.js": "sha384-f7Or3eTbD0Jfw0+P1NyIiAPgoJ37CcCWoZg7k659VzFESxpqXQ+b/KTVnkkbie1U",

    <!--
      The browser Tailwind compiler styles development pages. `npm run build`
      replaces it with the generated app.css for a release.
    -->
    <script
      src="/lib/vendor/tailwind-browser.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    ></script>

    <!--
      Map semantic component tokens to Tailwind names. `src/app.css` carries the
      same map for the production build.
    -->
    <style type="text/tailwindcss">
      /*
        `dark:` follows the resolved theme rather than the OS, so a light choice on a
        dark system stays light. `ocean` is this application's dark registered theme.
      */
      @custom-variant dark {
        &:where([data-theme='dark'], [data-theme='dark'] *, [data-theme='ocean'], [data-theme='ocean'] *) {
          @slot;
        }
        @media (prefers-color-scheme: dark) {
          &:where(:root:not([data-theme]), :root:not([data-theme]) *) {
            @slot;
          }
        }
      }

      @theme inline {
        --color-canvas: var(--ui-color-canvas);
        --color-surface: var(--ui-color-surface);
        --color-surface-raised: var(--ui-color-surface-raised);
        --color-ink: var(--ui-color-text);
        --color-muted: var(--ui-color-text-muted);
        --color-ui-border: var(--ui-color-border);
        --color-brand: var(--ui-color-primary);
        --color-brand-hover: var(--ui-color-primary-hover);
        --color-brand-contrast: var(--ui-color-primary-contrast);
        --color-accent: var(--ui-color-accent);
        --color-accent-strong: var(--ui-color-accent-strong);
        --color-sidebar: var(--ui-color-sidebar);
        --color-sidebar-text: var(--ui-color-sidebar-text);
        --color-sidebar-muted: var(--ui-color-sidebar-muted);
        --color-sidebar-hover: var(--ui-color-sidebar-hover);
        --color-sidebar-active: var(--ui-color-sidebar-active);
        --color-overlay: var(--ui-color-overlay);
      }
    </style>

    <!-- <link rel="stylesheet" href="/app.css" /> -->

    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="h-full bg-canvas text-ink antialiased">
    <app-root></app-root>
    <noscript class="block p-8 text-red-700">This application requires JavaScript.</noscript>
  </body>
</html>
