<!doctype html>
<html lang="en" dir="ltr" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Meridian is the example, srl is the library. The tab is the first place that
         distinction can be made, and the last place it should be left implicit. -->
    <title>Meridian — a CRM example app built with srl</title>

    <!--
      Low-specificity defaults for the shared components, and the palette they paint with.

      Two files because they are two decisions. style.css defines no colour at all; the
      tokens it reads come from theme-default.css, which this application links because
      the collection's own neutral palette is what it wants. An application with a brand
      drops the second link and defines the same `--ui-color-*` names itself — the first
      link is unchanged, so there is nothing to override.

      Order matters only in the ordinary cascade sense: both are unlayered, and the
      palette sets custom properties the defaults read, so either order resolves the same.
    -->
    <link rel="stylesheet" href="/components/style.css" />
    <link rel="stylesheet" href="/components/theme-default.css" />

    <!--
      IMPORT MAP. Must appear before any module script.

      The library's half of this block is published rather than written: it is
      source/lib/importmap.json, generated by `npm run importmap` from source/package.json
      and the bytes in /lib/vendor, and `npm run verify` fails when what is pasted here
      differs from it. What stays this application's own is everything below the library
      prefixes: its remotes and their hashes.

      The same three mounts every application on this framework sees:

        /             this directory (example), the application
        /lib/         source/lib, the framework: core, auth, host and its vendored deps
        /components/  source/components, the shared component collection

      ONE DELIBERATE OMISSION: `@app/`.

      A path prefix can only mean one directory, so `@app/*` can point into at most one
      application's src/ — and the root tsconfig.json therefore declares it for none. An
      application that used `@app/…` anyway would have the browser resolve it here and tsc
      resolve it nowhere: the same specifier meaning two different files, silently, with
      the type checker validating the wrong ones. So this application uses relative imports
      inside its own src/, and leaving the prefix undeclared turns a mistake into an
      `npm run verify` failure rather than a class of bug.

      Vendored dependencies and their hashes are the same for every application on purpose:
      one /lib/vendor serves all of them, so two applications cannot disagree about which
      bytes are `lit`.

      The `integrity` block is enforced by the browser for same-origin paths exactly as it
      is for CDN URLs: a vendored or remote file whose bytes do not match its hash fails to
      load rather than executing. So these hashes are a runtime control, not merely a CI
      checksum, and a tampered /lib/vendor or /remotes cannot run.
    -->
    <script type="importmap">
      {
        "imports": {
          "lit": "/lib/vendor/lit-all.min.js",
          "lit/async-directive.js": "/lib/vendor/lit-all.min.js",
          "lit/directives/repeat.js": "/lib/vendor/lit-all.min.js",

          "@preact/signals-core": "/lib/vendor/signals-core.mjs",

          "@core/": "/lib/core/",
          "@auth/": "/lib/auth/",
          "@host/": "/lib/host/",
          "@components/": "/components/"
        },
        "integrity": {
          "/lib/vendor/lit-all.min.js": "sha384-qSoE0anPDAzsBuoT95C270Wd5oKtOOlLdEvSXEk9bRYTg+5ygjyt20ZuhzH0oNbt",
          "/lib/vendor/signals-core.mjs": "sha384-keryyWsAJJ2UD+2G3I6cCzzXkFvp97AwDUCMKAOYrVGK2iwcrnTYMpWMrq9xkPSm",
"/remotes/billing/remote-entry.js": "sha384-E5eqKtGjo78yF0+SPoZq6Mzz7Rg8MEavpNn/qdAhXBzeujy57OZ12Xqp0SScrzWC",
          "/remotes/billing/billing-root.js": "sha384-oJGIL+1EanlvUX+HnOCDILHEO3ZOUH7+4kF4VAwL0BD3BFCTlfpcpeQgpHlmRtR6",
"/remotes/analytics/remote-entry.js": "sha384-gikXl5fGQ0JSt91gbIGS5QeVey8/CZ/dOXzGvDIIuh350ltSRN/++0TlTFf+R13O",
          "/remotes/analytics/analytics-root.js": "sha384-UIHeDBMl71bh6r1rmjC4ki1XY9J0qJNqPtBbEVKB0xN+Z0pvrtCk7biIxz9k5rtn"
        }
      }
    </script>

    <!--
      STYLES. Two modes, pick one.

      Development (below): Tailwind v4 compiles in the browser off a MutationObserver, so
      dynamically mounted components are styled with no tooling at all. Vendored like
      everything else, integrity-checked, and explicitly not for production.

      Production: `npm run css:example` runs the Tailwind CLI once over this application's
      src/ and remotes/ and emits app.css. Comment out the script, uncomment the link. That
      CSS step is the only build in the project, and app.css is committed, so a deployment
      that never runs npm still has it.
    -->
    <script
      src="/lib/vendor/tailwind-browser.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    ></script>

    <!--
      Tailwind names for the component library's semantic tokens. The light, dark and
      custom values are owned by /components/theme-default.css and the theme controller; this block
      only exposes them as utility classes.

      Duplicated in src/app.css, which is the input to the production build. The browser
      JIT compiles what it finds in the document and never reads that file; the CLI reads
      that file and never sees this tag. Two modes, two entry points — the same split this
      file already has for the stylesheet.
    -->
    <style type="text/tailwindcss">
      @theme inline {
        --color-canvas: var(--ui-color-canvas);
        --color-surface: var(--ui-color-surface);
        --color-surface-raised: var(--ui-color-surface-raised);
        --color-ink: var(--ui-color-text);
        --color-muted: var(--ui-color-text-muted);
        --color-ui-border: var(--ui-color-border);
        --color-brand: var(--ui-color-primary);
        --color-brand-hover: var(--ui-color-primary-hover);
        --color-brand-contrast: var(--ui-color-primary-contrast);
        --color-accent: var(--ui-color-accent);
        --color-accent-strong: var(--ui-color-accent-strong);
        --color-sidebar: var(--ui-color-sidebar);
        --color-sidebar-text: var(--ui-color-sidebar-text);
        --color-sidebar-muted: var(--ui-color-sidebar-muted);
        --color-sidebar-hover: var(--ui-color-sidebar-hover);
        --color-sidebar-active: var(--ui-color-sidebar-active);
        --color-overlay: var(--ui-color-overlay);
      }

      /*
       * What box each component is. A custom element is `display: inline` until
       * something says otherwise, and an inline box ignores vertical margins —
       * `space-y-*` between two cards then produces no gap — and sits on a line box,
       * whose strut leaves its content low inside it. Duplicated in src/app.css,
       * like the block above.
       */
      app-card,
      app-notice,
      app-stat,
      app-field,
      app-tabs {
        display: block;
      }

      app-badge {
        display: inline-flex;
      }
    </style>

    <!-- <link rel="stylesheet" href="/app.css" /> -->

    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="h-full bg-canvas text-ink antialiased">
    <app-root></app-root>
    <noscript class="block p-8 text-red-700">This application requires JavaScript.</noscript>
  </body>
</html>
